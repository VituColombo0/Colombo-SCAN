name: dehashed-api
category: 🔐 Vazamentos Profundos
description: Busca credenciais em texto claro (requer key, simulação).
command: curl -s -u {env.DEHASHED_EMAIL}:{env.DEHASHED_API_KEY} 'https://api.dehashed.com/search?query={alvo_url}'
inputs:
- id: alvo
  prompt: 'Email ou IP alvo:'
timeout: 40
safe: true
