name: wigle-wifi
category: 🌍 Geolocalização
description: Mapeia redes WiFi baseadas em MAC Address ou SSID, ótimo para GEO Intel.
command: curl -s -u {env.WIGLE_API_KEY_ID}:{env.WIGLE_API_TOKEN} 'https://api.wigle.net/api/v2/network/search?ssid={alvo_url}'
inputs:
- id: alvo
  prompt: 'Nome da Rede WiFi (SSID):'
timeout: 45
safe: true
