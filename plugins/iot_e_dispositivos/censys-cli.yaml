name: censys-cli
category: 💻 IoT e Dispositivos
description: Busca certificados SSL, hosts expostos e servidores via Censys.
command: curl -u {env.CENSYS_ID}:{env.CENSYS_SECRET} -A 'Colombo_SCAN' -s 'https://search.censys.io/api/v2/hosts/{alvo_url}'
inputs:
- id: alvo
  prompt: 'IP alvo:'
timeout: 40
safe: true
